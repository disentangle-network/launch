apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: disentangle
data:
  cluster_name: "test-cluster"
  arch: "amd64"
  infra: "cloud"
  nodes: "3"
  resources: "medium"
  cpu_limit: "500m"
  memory_limit: "512Mi"
  cpu_request: "100m"
  memory_request: "128Mi"
  pow_difficulty: "8"
  nebula_mode: "disabled"
  nebula_prefix: "10.42.0"
