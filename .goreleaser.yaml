version: 2

project_name: launch

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - main: .
    binary: launch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/disentangle-network/launch/cmd.version={{.Version}}
      - -X github.com/disentangle-network/launch/cmd.commit={{.Commit}}
      - -X github.com/disentangle-network/launch/cmd.buildDate={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - name: disentangle-launch
    repository:
      owner: disentangle-network
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/disentangle-network/launch
    description: Deployment orchestrator for the Disentangle Network
    license: Apache-2.0
    skip_upload: auto
    install: |
      bin.install "launch"
    test: |
      system "#{bin}/launch", "--version"
